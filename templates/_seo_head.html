{# Expects seo_title, seo_description, seo_canonical, seo_robots, seo_og_image from context #}
<link rel="icon" href="{{ url_for('static', filename='wtt-favicon.ico') }}?v=wtt8" sizes="any">
<link rel="shortcut icon" href="{{ url_for('static', filename='wtt-favicon.ico') }}?v=wtt8">
<link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='wtt-favicon-48.png') }}?v=wtt8">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='wtt-favicon-192.png') }}?v=wtt8">
<link rel="apple-touch-icon" sizes="192x192" href="{{ url_for('static', filename='wtt-favicon-192.png') }}?v=wtt8">
<meta name="theme-color" content="#1E223D">
<meta name="msapplication-TileColor" content="#1E223D">
<meta name="msapplication-TileImage" content="{{ url_for('static', filename='wtt-favicon-192.png') }}?v=wtt8">
<meta name="description" content="{{ seo_description }}">
<link rel="canonical" href="{{ seo_canonical }}">
<meta name="robots" content="{{ seo_robots }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Welcome to Trades">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ seo_canonical }}">
<meta property="og:image" content="{{ seo_og_image }}">
<meta property="og:image:secure_url" content="{{ seo_og_image }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Welcome to Trades - on-site mining and trades jobs in the USA and Canada">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<meta name="twitter:image" content="{{ seo_og_image }}">
<meta name="twitter:image:alt" content="Welcome to Trades - on-site mining and trades jobs in the USA and Canada">
{% if google_site_verification %}
<meta name="google-site-verification" content="{{ google_site_verification }}">
{% endif %}
{% if ga4_measurement_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga4_measurement_id }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ ga4_measurement_id }}');
</script>
{% endif %}
{% if clarity_project_id %}
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "{{ clarity_project_id }}");
</script>
{% endif %}
