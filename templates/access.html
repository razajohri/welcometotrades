<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ seo_title }}</title>
    {% include '_seo_head.html' %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=brand1">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .access-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: url('/static/access-bg.jpg') center 38% / cover no-repeat;
        }

        .access-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.42) 0%,
                rgba(0, 0, 0, 0.32) 45%,
                rgba(0, 0, 0, 0.55) 100%
            );
        }

        .access-hero {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding:
                max(28px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
        }

        .access-stack {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
        }

        .access-rating {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
        }

        .access-stars {
            font-size: 1rem;
            letter-spacing: 0.08em;
            color: #fbbf24;
            line-height: 1;
        }

        .access-rating-score {
            font-size: 0.875rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .access-logo-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            overflow: hidden;
            background: #F54F1B;
        }

        .access-logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            background: #F54F1B;
            transform: scale(1.12);
        }

        .access-headline {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.03em;
            color: #fff;
            max-width: 14em;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
        }

        .access-form {
            display: flex;
            align-items: stretch;
            width: 100%;
            gap: 0;
            background: #fff;
            border-radius: 999px;
            padding: 4px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
        }

        .access-input {
            flex: 1 1 auto;
            min-width: 0;
            border: none;
            background: transparent;
            padding: 14px 18px;
            font-size: 1rem;
            font-family: inherit;
            color: #111;
            outline: none;
            border-radius: 999px 0 0 999px;
        }

        .access-input::placeholder {
            color: #9ca3af;
        }

        .access-continue {
            flex: 0 0 auto;
            border: none;
            border-radius: 999px;
            padding: 14px 22px;
            min-height: 48px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: #fff;
            background: #F54F1B;
            cursor: pointer;
            white-space: nowrap;
            transition: filter 0.15s ease, transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .access-continue:hover {
            filter: brightness(1.06);
        }

        .access-continue:active {
            transform: scale(0.98);
        }

        .access-status {
            margin: 0;
            font-size: 0.9375rem;
            text-align: center;
            color: #fecaca;
        }

        .access-legal {
            margin: 4px 0 0;
            font-size: 0.75rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.72);
            text-align: center;
        }

        .access-legal a {
            color: #fff;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .access-legal a:hover {
            color: #fff;
            opacity: 0.9;
        }

        @media (max-width: 540px) {
            .access-hero {
                padding:
                    max(16px, env(safe-area-inset-top))
                    max(16px, env(safe-area-inset-right))
                    max(16px, env(safe-area-inset-bottom))
                    max(16px, env(safe-area-inset-left));
            }

            .access-stack {
                gap: 14px;
            }

            .access-logo-wrap,
            .access-logo {
                width: 52px;
                height: 52px;
            }

            .access-headline {
                font-size: 1.375rem;
            }

            .access-form {
                flex-direction: column;
                border-radius: 16px;
                padding: 6px;
                gap: 6px;
            }

            .access-input {
                border-radius: 12px;
                background: #f9fafb;
                text-align: center;
                font-size: 16px;
                padding: 12px 14px;
            }

            .access-continue {
                width: 100%;
                border-radius: 12px;
                padding: 12px 16px;
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="access-bg" aria-hidden="true"></div>

    <main class="access-hero">
        <div class="access-stack">
            <div class="access-rating" aria-label="Rated 4.75 out of 5 stars">
                <div class="access-stars" aria-hidden="true">★★★★★</div>
                <div class="access-rating-score">4.75</div>
            </div>

            <div class="access-logo-wrap">
                <img src="{{ url_for('static', filename='logo.png') }}?v=wtt7" alt="Welcome to Trades" class="access-logo">
            </div>

            <h1 class="access-headline">On-site mining &amp; trades jobs.</h1>

            {% if error %}
            <p class="access-status">{{ error }}</p>
            {% endif %}

            <form class="access-form" method="POST" action="{{ url_for('access') }}">
                <input
                    class="access-input"
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    value="{{ email or '' }}"
                    required
                    autocomplete="email"
                    aria-label="Email address"
                >
                <button class="access-continue" type="submit">Continue</button>
            </form>

            <p class="access-legal">
                By continuing you agree to our
                <a href="{{ url_for('privacy') }}">privacy policy</a>.
            </p>
        </div>
    </main>
</body>
</html>
