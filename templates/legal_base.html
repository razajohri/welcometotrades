<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block seo_title %}{{ seo_title }}{% endblock %}</title>
    {% include '_seo_head.html' %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=brand1">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}legal-page{% endblock %}">
    <header class="app-topbar">
        <div class="app-topbar-inner">
            <a href="{{ brand_home_url }}" class="app-topbar-brand">
                <img src="{{ url_for('static', filename='logo-mark.svg') }}?v=1" alt="Welcome to Trades" class="app-topbar-logo">
                <span class="app-topbar-title">Welcome to Trades</span>
            </a>
            <div class="app-topbar-actions">
                <a href="{{ sign_in_cta_url }}" class="btn btn-outline">Sign in</a>
                <a href="{{ access_cta_url }}" class="btn btn-primary">Get Access</a>
            </div>
        </div>
    </header>

    <main class="legal-main">
        <article class="legal-content">
            {% block content %}{% endblock %}
        </article>
    </main>

    {% include '_footer.html' %}
</body>
</html>
